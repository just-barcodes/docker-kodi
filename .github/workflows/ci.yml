name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly rebuild so breakage in the Ubuntu base image or Kodi packages
    # is noticed even when nothing in this repository changes.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -s bash entrypoint.sh tests/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: make build

      - name: Test image
        run: tests/test-image.sh
